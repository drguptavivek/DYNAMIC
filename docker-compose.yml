services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dynamic_dev
      POSTGRES_USER: dynamic
      POSTGRES_PASSWORD: dynamic_dev_password
    ports:
      - "${DYNAMIC_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${DYNAMIC_REDIS_PORT:-56379}:6379"

  nginx:
    image: nginx:1.27-alpine
    profiles:
      - edge
    ports:
      - "${DYNAMIC_NGINX_PORT:-58080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
