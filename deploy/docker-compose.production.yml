services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: ${DYNAMIC_POSTGRES_DB:?Set DYNAMIC_POSTGRES_DB}
      POSTGRES_USER: ${DYNAMIC_POSTGRES_USER:?Set DYNAMIC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DYNAMIC_POSTGRES_PASSWORD:?Set DYNAMIC_POSTGRES_PASSWORD}
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - dynamic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$DYNAMIC_POSTGRES_USER\" -d \"$$DYNAMIC_POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DYNAMIC_REDIS_PASSWORD: ${DYNAMIC_REDIS_PASSWORD:?Set DYNAMIC_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --bind 127.0.0.1 --protected-mode yes --appendonly yes --requirepass \"$${DYNAMIC_REDIS_PASSWORD}\""]
    volumes:
      - dynamic_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -a \"$$DYNAMIC_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/dynamic/tls:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dynamic_postgres_data:
    name: dynamic_postgres_data
  dynamic_redis_data:
    name: dynamic_redis_data
